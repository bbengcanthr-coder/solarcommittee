  <script>
    let backendRecords = [];
    let activeFilter = "all";
    let initialLoadTimer;
    let hasInitialData = false;
    const pendingEdits = new Map();
    let writeChain = Promise.resolve();
    let lastWriteAt = 0;

    const list = document.getElementById("record-list");
    const loadState = document.getElementById("load-state");
    const loadError = document.getElementById("load-error");
    const emptyState = document.getElementById("empty-state");
    const limitMessage = document.getElementById("limit-message");
    const toast = document.getElementById("toast");

    function showToast(message, type) {
      toast.textContent = message;
      toast.className = "toast show " + (type || "");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => { toast.className = "toast"; }, 3600);
    }

    function formatDate(isoDate) {
      if (!isoDate) return "ไม่ระบุวันที่";
      const date = new Date(isoDate + "T00:00:00");
      if (Number.isNaN(date.getTime())) return isoDate;
      return new Intl.DateTimeFormat("th-TH", {
        day: "numeric", month: "short", year: "numeric"
      }).format(date);
    }

    function isAccepted(status) {
      return status === "รับพิจารณาแล้ว";
    }

    function updateSummary() {
      document.getElementById("total-count").textContent = backendRecords.length;
      document.getElementById("pending-count").textContent =
        backendRecords.filter(record => !isAccepted(record.status)).length;
      document.getElementById("accepted-count").textContent =
        backendRecords.filter(record => isAccepted(record.status)).length;

      if (backendRecords.length >= 900) {
        limitMessage.textContent = "จำนวนรายการปัจจุบัน " + backendRecords.length + " จากสูงสุด 999 รายการ";
        limitMessage.classList.remove("hidden");
      } else {
        limitMessage.classList.add("hidden");
      }
    }

    function filteredRecords() {
      return backendRecords
        .filter(record => activeFilter === "all" || record.status === activeFilter)
        .slice()
        .sort((a, b) => String(b.submitted_date).localeCompare(String(a.submitted_date)));
    }

    function recordById(id) {
      return backendRecords.find(record => record.__backendId === id);
    }

    function createRecordElement(record) {
      const fragment = document.getElementById("record-template").content.cloneNode(true);
      const article = fragment.querySelector("article");
      article.dataset.recordId = record.__backendId;

      article.querySelector(".record-section").textContent = record.section_name || "ไม่ระบุหัวข้อ";
      article.querySelector(".record-member").textContent = record.committee_member || "ไม่ระบุชื่อ";
      article.querySelector(".record-date").textContent = formatDate(record.submitted_date);
      article.querySelector(".record-original").textContent = record.original_content || "—";
      article.querySelector(".record-proposed").textContent = record.proposed_change || "—";
      article.querySelector(".record-reason").textContent = record.reason || "—";
      article.querySelector(".record-image-description").textContent = record.image_description || "—";

      const badge = article.querySelector(".record-status");
      badge.textContent = record.status || "รอพิจารณา";
      badge.classList.add(isAccepted(record.status) ? "status-accepted" : "status-pending");

      const select = article.querySelector(".record-status-select");
      select.id = "status-" + record.__backendId;
      select.innerHTML = '<option value="รอพิจารณา">รอพิจารณา</option><option value="รับพิจารณาแล้ว">รับพิจารณาแล้ว</option>';
      select.value = record.status || "รอพิจารณา";
      select.addEventListener("change", () => queueStatusUpdate(record.__backendId, select.value));

      const deleteButton = article.querySelector(".delete-button");
      deleteButton.addEventListener("click", () => handleDelete(deleteButton, article));

      return article;
    }

    function render() {
      const records = filteredRecords();
      const existing = new Map(
        [...list.children].map(element => [element.dataset.recordId, element])
      );

      records.forEach(record => {
        let element = existing.get(record.__backendId);
        if (!element) {
          element = createRecordElement(record);
          list.appendChild(element);
        } else {
          const pending = pendingEdits.get(record.__backendId);
          const displayedStatus = pending ? pending.status : record.status;
          element.querySelector(".record-section").textContent = record.section_name || "ไม่ระบุหัวข้อ";
          element.querySelector(".record-member").textContent = record.committee_member || "ไม่ระบุชื่อ";
          element.querySelector(".record-date").textContent = formatDate(record.submitted_date);
          element.querySelector(".record-original").textContent = record.original_content || "—";
          element.querySelector(".record-proposed").textContent = record.proposed_change || "—";
          element.querySelector(".record-reason").textContent = record.reason || "—";
          element.querySelector(".record-image-description").textContent = record.image_description || "—";
          const badge = element.querySelector(".record-status");
          badge.textContent = displayedStatus || "รอพิจารณา";
          badge.classList.toggle("status-accepted", isAccepted(displayedStatus));
          badge.classList.toggle("status-pending", !isAccepted(displayedStatus));
          element.querySelector(".record-status-select").value = displayedStatus || "รอพิจารณา";
        }
        existing.delete(record.__backendId);
      });

      existing.forEach(element => element.remove());
      emptyState.classList.toggle("hidden", !hasInitialData || records.length !== 0);
      updateSummary();
      lucide.createIcons();
    }

    function renderLoadError(message) {
      loadState.classList.add("hidden");
      loadError.classList.remove("hidden");
      loadError.querySelector("[data-template-id='load-error-label']").textContent = message;
    }

    const handler = {
      onDataChanged(data) {
        clearTimeout(initialLoadTimer);
        hasInitialData = true;
        backendRecords = Array.isArray(data) ? data : [];
        loadState.classList.add("hidden");
        loadError.classList.add("hidden");
        render();
      }
    };

    async function initializeDataSdk() {
      clearTimeout(initialLoadTimer);
      loadError.classList.add("hidden");
      loadState.classList.remove("hidden");
      initialLoadTimer = setTimeout(() => {
        renderLoadError("ไม่สามารถโหลดข้อมูลที่บันทึกไว้ได้ กรุณาลองเชื่อมต่อใหม่อีกครั้ง");
      }, 8000);

      try {
        const initResult = await window.dataSdk.init(handler);
        if (!initResult.isOk) {
          clearTimeout(initialLoadTimer);
          renderLoadError("ไม่สามารถเชื่อมต่อข้อมูลที่บันทึกไว้ได้ กรุณาลองใหม่อีกครั้ง");
        }
      } catch (error) {
        clearTimeout(initialLoadTimer);
        renderLoadError("ไม่สามารถเริ่มการเชื่อมต่อข้อมูลได้ กรุณาลองใหม่อีกครั้ง");
      }
    }

    function setSubmitState(button, pending) {
      button.disabled = pending;
      const icon = button.querySelector("svg");
      if (icon) icon.style.display = pending ? "none" : "";
      button.dataset.originalText = button.dataset.originalText || button.textContent.trim();
      button.lastChild.textContent = pending ? "กำลังบันทึก..." : button.dataset.originalText;
    }

    document.getElementById("entry-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const submitButton = form.querySelector("button[type='submit']");
      const message = document.getElementById("form-message");

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (backendRecords.length >= 999) {
        limitMessage.textContent = "ไม่สามารถเพิ่มรายการได้ เนื่องจากครบจำนวนสูงสุด 999 รายการแล้ว";
        limitMessage.classList.remove("hidden");
        return;
      }

      const record = {
        section_name: document.getElementById("section-name").value.trim(),
        original_content: document.getElementById("original-content").value.trim(),
        proposed_change: document.getElementById("proposed-change").value.trim(),
        reason: document.getElementById("reason").value.trim(),
        committee_member: document.getElementById("committee-member").value.trim(),
        submitted_date: document.getElementById("submitted-date").value,
        image_description: document.getElementById("image-description").value.trim(),
        status: document.getElementById("new-status").value
      };

      setSubmitState(submitButton, true);
      message.textContent = "";
      try {
        const result = await window.dataSdk.create(record);
        if (!result.isOk) {
          message.textContent = "ไม่สามารถยืนยันการบันทึกได้ กรุณารีเฟรชก่อนลองอีกครั้ง";
          message.className = "text-sm text-[#9f2028]";
        } else {
          form.reset();
          document.getElementById("submitted-date").value = new Date().toISOString().slice(0, 10);
          message.textContent = "บันทึกข้อเสนอเรียบร้อยแล้ว";
          message.className = "text-sm text-[#176348]";
          showToast("บันทึกข้อเสนอเรียบร้อยแล้ว", "success");
        }
      } catch (error) {
        message.textContent = "เกิดข้อผิดพลาดระหว่างการบันทึก กรุณาลองอีกครั้ง";
        message.className = "text-sm text-[#9f2028]";
      } finally {
        setSubmitState(submitButton, false);
      }
    });

    function queueStatusUpdate(recordId, status) {
      const current = recordById(recordId);
      if (!current) {
        showToast("ไม่พบรายการที่ต้องการแก้ไข", "error");
        return;
      }

      const previous = pendingEdits.get(recordId) || {};
      pendingEdits.set(recordId, { ...previous, status });
      render();

      writeChain = writeChain.then(async () => {
        const pending = pendingEdits.get(recordId);
        const sourceRecord = recordById(recordId);
        if (!pending || !sourceRecord) return;

        const fieldsToSend = { ...pending };
        const now = Date.now();
        const wait = Math.max(0, 500 - (now - lastWriteAt));
        if (wait) await new Promise(resolve => setTimeout(resolve, wait));

        const latest = pendingEdits.get(recordId);
        if (!latest || latest.status !== fieldsToSend.status) return;

        lastWriteAt = Date.now();
        try {
          const result = await window.dataSdk.update({ ...sourceRecord, ...fieldsToSend });
          if (!result.isOk) {
            pendingEdits.delete(recordId);
            render();
            showToast("ไม่สามารถยืนยันการเปลี่ยนสถานะได้ กรุณารีเฟรชก่อนลองใหม่", "error");
            return;
          }

          const after = pendingEdits.get(recordId);
          if (after && after.status === fieldsToSend.status) {
            pendingEdits.delete(recordId);
          }
          showToast("อัปเดตสถานะแล้ว", "success");
        } catch (error) {
          pendingEdits.delete(recordId);
          render();
          showToast("ไม่สามารถอัปเดตสถานะได้ กรุณาลองใหม่", "error");
        }
      });
    }

    async function handleDelete(button, row) {
      const record = recordById(row.dataset.recordId);
      if (!record) {
        showToast("ไม่พบรายการที่ต้องการลบ", "error");
        return;
      }

      const label = button.querySelector(".delete-label");
      if (button.dataset.confirming !== "true") {
        button.dataset.confirming = "true";
        label.textContent = "ยืนยันการลบ";
        button.classList.add("bg-[#fff1f1]", "border-[#9f2028]");
        setTimeout(() => {
          if (button.dataset.confirming === "true") {
            button.dataset.confirming = "false";
            label.textContent = "ลบรายการ";
            button.classList.remove("bg-[#fff1f1]", "border-[#9f2028]");
          }
        }, 5000);
        return;
      }

      button.disabled = true;
      label.textContent = "กำลังลบ...";
      try {
        const result = await window.dataSdk.delete(record);
        if (!result.isOk) {
          showToast("ไม่สามารถยืนยันการลบได้ กรุณารีเฟรชก่อนลองใหม่", "error");
        } else {
          row.remove();
          showToast("ลบรายการแล้ว", "success");
        }
      } catch (error) {
        showToast("ไม่สามารถลบรายการได้ กรุณาลองใหม่", "error");
      } finally {
        button.disabled = false;
        button.dataset.confirming = "false";
        label.textContent = "ลบรายการ";
        button.classList.remove("bg-[#fff1f1]", "border-[#9f2028]");
      }
    }

    document.querySelectorAll("[data-filter]").forEach(button => {
      button.addEventListener("click", () => {
        activeFilter = button.dataset.filter;
        document.querySelectorAll("[data-filter]").forEach(item => {
          item.classList.toggle("is-active", item === button);
        });
        render();
      });
    });

    document.getElementById("retry-button").addEventListener("click", initializeDataSdk);

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("submitted-date").value = new Date().toISOString().slice(0, 10);
      lucide.createIcons();
      initializeDataSdk();
    });
  </script>
 </body>
</html>
